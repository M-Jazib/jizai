<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="40" cy="40" r="38" fill="#111118" stroke="url(#iconGrad2)" stroke-width="1.5"/>

  <!-- Hexagon -->
  <path d="M40 12 L64 26 L64 54 L40 68 L16 54 L16 26 Z" 
        fill="none" 
        stroke="url(#iconGrad2)" 
        stroke-width="2"
        filter="url(#glow2)"/>

  <!-- Center node -->
  <circle cx="40" cy="40" r="5" fill="url(#iconGrad2)" filter="url(#glow2)"/>

  <!-- Connection lines -->
  <line x1="40" y1="35" x2="40" y2="18" stroke="url(#iconGrad2)" stroke-width="1.5" opacity="0.5"/>
  <line x1="40" y1="45" x2="40" y2="62" stroke="url(#iconGrad2)" stroke-width="1.5" opacity="0.5"/>
  <line x1="35" y1="40" x2="20" y2="40" stroke="url(#iconGrad2)" stroke-width="1.5" opacity="0.5"/>
  <line x1="45" y1="40" x2="60" y2="40" stroke="url(#iconGrad2)" stroke-width="1.5" opacity="0.5"/>

  <!-- Corner nodes -->
  <circle cx="40" cy="18" r="2.5" fill="url(#iconGrad2)"/>
  <circle cx="40" cy="62" r="2.5" fill="url(#iconGrad2)"/>
  <circle cx="20" cy="40" r="2.5" fill="url(#iconGrad2)"/>
  <circle cx="60" cy="40" r="2.5" fill="url(#iconGrad2)"/>
</svg>