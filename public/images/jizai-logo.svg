<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for icon -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Hexagon with lightning bolt / circuit node -->
  <g transform="translate(20, 20)">
    <!-- Outer hexagon -->
    <path d="M40 4 L72 22 L72 58 L40 76 L8 58 L8 22 Z" 
          fill="none" 
          stroke="url(#iconGrad)" 
          stroke-width="2.5"
          filter="url(#glow)"/>

    <!-- Inner circuit lines -->
    <circle cx="40" cy="40" r="6" fill="url(#iconGrad)" filter="url(#glow)"/>
    <line x1="40" y1="34" x2="40" y2="10" stroke="url(#iconGrad)" stroke-width="2" opacity="0.6"/>
    <line x1="40" y1="46" x2="40" y2="70" stroke="url(#iconGrad)" stroke-width="2" opacity="0.6"/>
    <line x1="34" y1="40" x2="12" y2="40" stroke="url(#iconGrad)" stroke-width="2" opacity="0.6"/>
    <line x1="46" y1="40" x2="68" y2="40" stroke="url(#iconGrad)" stroke-width="2" opacity="0.6"/>

    <!-- Corner nodes -->
    <circle cx="40" cy="10" r="3" fill="url(#iconGrad)" opacity="0.8"/>
    <circle cx="40" cy="70" r="3" fill="url(#iconGrad)" opacity="0.8"/>
    <circle cx="12" cy="40" r="3" fill="url(#iconGrad)" opacity="0.8"/>
    <circle cx="68" cy="40" r="3" fill="url(#iconGrad)" opacity="0.8"/>

    <!-- Diagonal connections -->
    <line x1="22" y1="22" x2="32" y2="32" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="58" y1="22" x2="48" y2="32" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="22" y1="58" x2="32" y2="48" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="58" y1="58" x2="48" y2="48" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Text: JizAI -->
  <text x="110" y="58" 
        font-family="Inter, system-ui, sans-serif" 
        font-size="52" 
        font-weight="800" 
        fill="url(#textGrad)"
        letter-spacing="-1.5">
    JizAI
  </text>

  <!-- Tagline -->
  <text x="112" y="82" 
        font-family="Inter, system-ui, sans-serif" 
        font-size="13" 
        font-weight="500" 
        fill="#94a3b8"
        letter-spacing="2.5">
    AUTOMATE SMARTER. WORK BETTER.
  </text>
</svg>